[package]
name = "gitlab-time-report"
description = "Library to generate statistics and charts from GitLab time tracking data."
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
categories = ["visualization"]

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
reqwest = { version = "0.13.1", default-features = false, features = ["http2", "default-tls", "system-proxy", "blocking", "json"] }
serde = { version = "1.0.228", default-features = false }
serde_json = { version = "1.0.149", default-features = false }
serde_with = { version = "3.16.1", default-features = false, features = ["chrono"] }
serde_path_to_error = { version = "0.1.20", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
csv = { version = "1.4.0", default-features = false }
charming = { version = "0.6.0", default-features = false, features = ["ssr"] }
build_html = { version = "2.7.0", default-features = false }
scraper = { version = "0.25.0", default-features = false }

[dev-dependencies]
mockall = { version = "0.14.0", default-features = false }
tempfile = { version = "3.24.0", default-features = false }
