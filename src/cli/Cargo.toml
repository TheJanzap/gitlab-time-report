[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[[bin]]
name = "gitlab-time-report-cli"
path = "src/main.rs"

[dependencies]
gitlab-time-report = { workspace = true }
chrono = { workspace = true }
clap = { version = "4.5.53", default-features = false, features = ["std", "color", "suggestions", "error-context", "usage", "help", "derive", "env"] }
cli-table = { version = "0.5.0", default-features = false }

[dev-dependencies]
assert_cmd = { version = "2.1.1", default-features = false }
mockito = { version = "1.7.1", default-features = false }
predicates = { version = "3.1.3", default-features = false }
tempfile = { version = "3.23.0", default-features = false }
